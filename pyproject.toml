[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "depscan"
version = "0.5.2"
description = "Inventory the external services (cloud APIs, databases, self-hosted services, model downloads) a Python repository depends on"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["dependencies", "inventory", "static-analysis", "llm", "sbom"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []  # the scanner is stdlib-only; LLM providers are optional

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]   # only for --llm anthropic (API key)
dev = ["pytest>=8"]

[project.scripts]
depscan = "depscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
